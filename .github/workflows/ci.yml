name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      - name: Pyflakes
        run: python -m pyflakes backend src scripts

      - name: Import smoke test
        run: |
          python -c "from backend.app.main import app; print('routes:', len(app.routes))"
          python -c "
          import importlib
          for m in [
            'src.agents.ensemble', 'src.agents.rl_agent',
            'src.models.crisis_env', 'src.models.trading_env', 'src.models.neural_net',
            'src.utils.regime_filter', 'src.utils.portfolio_risk', 'src.utils.notifier',
            'scripts.walk_forward', 'scripts.evaluate_ensemble', 'scripts.train_general',
          ]:
              importlib.import_module(m)
          "

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t trademaster-ci .
